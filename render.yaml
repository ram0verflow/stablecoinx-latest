# Render Blueprint for CertaPay (StableCoinX).
#
# Infra-as-code only — see docs/SPONSOR_INTEGRATIONS.md. This file was never
# deployed against a live Render account in this repo; nothing here has been
# verified end-to-end the way the other sponsor integrations were. Deploying
# it for real requires a connected Render account and filling in every
# `sync: false` value in the dashboard after the first deploy.
#
# Architecture: backend (FastAPI/uvicorn) + frontend (static React/Vite
# build) + managed Postgres. Redis is optional (native Render Key Value) —
# the app already degrades gracefully without it (see
# app/services/... logs: "Redis unavailable ... Caching disabled"), so it's
# included but not required for the app to boot. Neo4j has no native Render
# service; wallet-graph intelligence needs an external instance (e.g. Neo4j
# Aura's free tier) — the app degrades gracefully without it too, same
# fail-safe pattern used throughout this codebase.

databases:
  - name: certapay-db
    plan: free
    databaseName: certapay
    user: certapay
    region: oregon

services:
  # ── Backend: FastAPI ──────────────────────────────────────────────────
  - name: certapay-backend
    type: web
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # "demo" (not "production") is deliberate: it's the gate seed_db()
      # checks (see app/db/seed.py / app/main.py's _startup_seed_and_graph)
      # — without it, a fresh Render Postgres boots with zero users, so
      # even the login page's own advertised demo accounts wouldn't exist.
      - key: APP_ENV
        value: demo
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_PORT
        value: "8000"

      # Database / cache — wired to the managed services in this blueprint
      - key: DATABASE_URL
        fromDatabase:
          name: certapay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: certapay-redis
          type: keyvalue
          property: connectionString

      # Auth — JWT secret is generated by Render, never committed
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # Supabase — real project required for full auth parity; app's own
      # JWT login does not hard-depend on it (see frontend Login.tsx, which
      # already tolerates Supabase being unreachable), but Settings()
      # startup validation requires these to be non-empty. Fill in real
      # values in the Render dashboard.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI advisory — Groq is the primary path; Ollama is a local fallback
      # that will never be reachable on Render (expected — the pipeline
      # already falls back to manual_review when neither engine responds,
      # verified live repeatedly during this project's own development).
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: gemma:2b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192

      # On-chain settlement (Base Sepolia testnet) — public RPC is a safe
      # default; the deploying wallet's private key and the four deployed
      # contract addresses are project-specific and must be supplied.
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org
      - key: BASE_SEPOLIA_CHAIN_ID
        value: "84532"
      - key: POLYGON_AMOY_RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: POLYGON_AMOY_CHAIN_ID
        value: "80002"
      - key: BACKEND_WALLET_PRIVATE_KEY
        sync: false
      - key: BACKEND_WALLET_ADDRESS
        sync: false
      - key: CONTRACT_ABI_PATH
        value: contracts/out
      - key: CONTRACT_ADDRESS_SETTLEMENT
        sync: false
      - key: CONTRACT_ADDRESS_COMPLIANCE
        sync: false
      - key: CONTRACT_ADDRESS_TREASURY
        sync: false
      - key: CONTRACT_ADDRESS_REGISTRY
        sync: false

      # Wallet graph intelligence — optional, degrades gracefully. Point at
      # a real Neo4j Aura instance to enable it; leave as-is to run without it.
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false

      # Telegram alerts — optional (see docs/SPONSOR_INTEGRATIONS.md; this
      # bot has been non-functional throughout this project's own testing).
      # "disabled"/"0" matches .env.example's own convention for "off".
      - key: TELEGRAM_BOT_TOKEN
        value: disabled
      - key: TELEGRAM_CHAT_ID
        value: "0"

      # CORS / cross-service URLs — filled in from the frontend service
      # Render creates below, so the two services can find each other
      # without hardcoding onrender.com URLs.
      - key: FRONTEND_URL
        fromService:
          name: certapay-frontend
          type: web
          property: host
      - key: BACKEND_URL
        fromService:
          name: certapay-backend
          type: web
          property: host
      - key: CORS_ORIGINS
        fromService:
          name: certapay-frontend
          type: web
          property: host

      # Privacy simulation services — not part of this blueprint; app
      # already runs its FHE/ZK checks in simulated mode without these.
      - key: ZK_PROVER_URL
        value: http://localhost:3001
      - key: FHE_GATEWAY_URL
        value: http://localhost:3002

      # Business config
      - key: TREASURY_DAILY_LIMIT
        value: "500000"
      - key: PAYROLL_BATCH_CAP
        value: "50000"

      # Beeceptor compliance provider — pointed at the real, already-live
      # sponsor-integration endpoint by default (see
      # docs/SPONSOR_INTEGRATIONS.md). This is a public mock-server URL,
      # not a secret; no API key is needed for the backend to *consume* it
      # at runtime (only rule management needs a key, and that's done from
      # a developer machine, never by this service).
      - key: COMPLIANCE_PROVIDER
        value: beeceptor
      - key: BEECEPTOR_BASE_URL
        value: https://certapay.proxy.beeceptor.com
      - key: BEECEPTOR_TIMEOUT_SECONDS
        value: "5"

      # n8n operations automation — the local instance used during
      # development (docs/SPONSOR_INTEGRATIONS.md) isn't internet-reachable.
      # Leave blank (disabled/no-op) until pointed at a hosted n8n instance.
      - key: N8N_WEBHOOK_URL
        value: ""
      - key: N8N_WEBHOOK_TIMEOUT_SECONDS
        value: "5"

      # Obfuscation Intelligence external attribution — same live Beeceptor
      # endpoint, already has real /tx-risk/{txid} demo rules configured
      # (docs/OBFUSCATION_INTELLIGENCE_DEMO.md).
      - key: OBFUSCATION_PROVIDER_MODE
        value: beeceptor
      - key: BEECEPTOR_OBFUSCATION_URL
        value: https://certapay.proxy.beeceptor.com
      - key: BEECEPTOR_OBFUSCATION_TIMEOUT_SECONDS
        value: "5"

  # ── Optional cache — app runs fine without this; included for parity
  #    with local dev, where Redis-backed caching is enabled when present.
  - name: certapay-redis
    type: keyvalue
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  # ── Frontend: static Vite/React build ─────────────────────────────────
  - name: certapay-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA client-side routing (React Router) — every path falls back to
      # index.html so a hard refresh on e.g. /obfuscation-intelligence works.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: certapay-backend
          type: web
          property: host
      - key: VITE_APP_NAME
        value: CertaPay

      # Wallet connect / chain config — needs a real WalletConnect Cloud
      # project ID to enable wallet connection in production.
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: VITE_CHAIN_ID
        value: "84532"
      - key: VITE_BASE_SEPOLIA_RPC
        value: https://sepolia.base.org
      - key: VITE_POLYGON_AMOY_RPC_URL
        value: https://rpc-amoy.polygon.technology

      # Supabase (frontend anon key — safe to expose client-side, but still
      # project-specific, so left blank rather than a fake placeholder).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

      # Demo account credentials shown in the login page's "Use a demo
      # account" toggle — match whatever the deployed database is seeded
      # with (see backend/app/db/seed or equivalent).
      - key: VITE_DEMO_ADMIN_EMAIL
        value: admin@settleguard.com
      - key: VITE_DEMO_TREASURY_EMAIL
        value: treasury@settleguard.com
      - key: VITE_DEMO_COMPLIANCE_EMAIL
        value: compliance@settleguard.com
      - key: VITE_DEMO_REVIEWER_EMAIL
        value: reviewer@settleguard.com
      - key: VITE_DEMO_AUDITOR_EMAIL
        value: auditor@settleguard.com
      - key: VITE_DEMO_PASSWORD
        value: hackathon123
